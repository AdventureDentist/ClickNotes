<style>

  --sans:"Segoe UI Variable Text","Segoe UI",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color-scheme:light;box-sizing:border-box}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#121A1D;--surface:#19242A;--ink:#E3EBEB;--muted:#93A4AA;--line:#2D3D44;--accent:#6FC2C6;--accent-ink:#0E1B1E;--ok:#8DCB97;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#121A1D;--surface:#19242A;--ink:#E3EBEB;--muted:#93A4AA;--line:#2D3D44;--accent:#6FC2C6;--accent-ink:#0E1B1E;--ok:#8DCB97;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
nav{display:flex;align-items:center;gap:4px;padding:8px 20px 0;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
nav strong{margin-right:14px;font-size:.95rem;white-space:nowrap}
.beta{font-weight:400;color:var(--muted);font-size:.85rem}
.tab{border:0;background:none;font:inherit;font-size:.95rem;color:var(--muted);padding:10px 14px 11px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab.right{margin-left:auto}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
.tab:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
main{flex:1;position:relative;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--paper)}
iframe.on{display:block}
#p-info{position:absolute;inset:0;overflow:auto;display:none;padding:28px 28px 60px}
#p-info.on{display:block}
.card{max-width:560px}
.card h1{margin:0 0 6px;font-size:1.5rem}
.card p{color:var(--muted);margin:0 0 22px;line-height:1.45}
.card label{display:block;font-weight:600;margin:0 0 6px}
.card small{display:block;color:var(--muted);font-weight:400;margin-top:2px}
.card input,.card textarea{width:100%;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:18px}
.card textarea{min-height:110px;resize:vertical}
.card button{font:inherit;border-radius:8px;padding:10px 16px;cursor:pointer}
.save{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);font-weight:700}
.reset{background:var(--surface);color:var(--ink);border:1px solid var(--line);margin-left:8px}
.status{margin-left:12px;color:var(--ok);font-size:.9rem}
</style>
</head>

</nav>

*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.4}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,420px);max-width:1440px;margin:0 auto;min-height:100vh}
main{padding:22px 28px 140px;min-width:0}
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin:0 0 18px}
.top h1{white-space:nowrap}
.top h1{margin:0;font-size:1.55rem;letter-spacing:-.01em}
.top p{margin:0;color:var(--muted);font-size:.9rem}

/* sections */
.sec{border-top:2px solid var(--ink);margin-top:22px}
.sec:first-of-type{margin-top:0}
.sec-h{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:10px 0 8px;text-align:left}
.sec-h h2{margin:0;font-size:1.08rem;font-weight:700}
.sec-h .chev{margin-left:auto;color:var(--muted);font-size:.85rem}
.sec-h .sum{color:var(--muted);font-size:.85rem;font-weight:400}
.sec-b{padding-bottom:6px}
.rest-h{display:flex;align-items:center;gap:10px}
.rest-h .remove{margin-left:auto;background:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:.82rem;color:var(--muted)}
.rest-h .remove:hover{color:var(--ink);border-color:var(--muted)}
.tag{font-family:var(--mono);font-size:.95rem;background:var(--enamel);color:var(--enamel-ink);border:1px solid var(--enamel-edge);border-radius:5px;padding:1px 7px}

.row{display:grid;grid-template-columns:168px minmax(0,1fr);gap:4px 14px;padding:7px 0;align-items:start}
.lab{font-weight:600;font-size:.9rem;padding-top:6px}
.lab small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid transparent;background:var(--chip);border-radius:999px;padding:6px 12px;font-size:.88rem;line-height:1.25;text-align:left;max-width:100%}
.chip:hover{border-color:var(--line)}
.chip[aria-pressed=&quot;true&quot;]{background:var(--accent);color:var(--accent-ink)}
.multi .chip[aria-pressed=&quot;true&quot;]::before{content:&quot;✓ &quot;;font-weight:700}
.txt{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 10px;width:100%;max-width:440px}
.txt.other{max-width:280px;flex:1 1 200px}
textarea.txt{min-height:64px;resize:vertical;max-width:560px}

/* linked options — the branch */
.branch{margin:2px 0 4px 8px;padding-left:18px;border-left:2px solid var(--branch);position:relative}
.branch &gt; .row{position:relative}
.branch &gt; .row::before{content:&quot;&quot;;position:absolute;left:-18px;top:17px;width:12px;border-top:2px solid var(--branch)}

.fixed{display:flex;gap:10px;align-items:flex-start;padding:8px 0;cursor:pointer;max-width:720px}
.fixed input{margin-top:3px;width:17px;height:17px;accent-color:var(--accent);flex:none}
.fixed span{font-size:.92rem}
.fixed.off span{color:var(--muted);text-decoration:line-through}
.fixed textarea{flex:1;min-height:60px}
.edited{text-decoration:underline dotted;text-underline-offset:3px}
.chip-edit{width:auto;min-width:220px;max-width:100%;flex:1 1 260px;border-color:var(--accent)}
.tick{display:inline-flex;gap:7px;align-items:center;background:var(--chip);border-radius:999px;padding:5px 12px 5px 9px;font-size:.88rem;cursor:pointer}
.tick input{width:16px;height:16px;accent-color:var(--accent);margin:0}

.arch .r{display:flex;gap:3px;align-items:center}
.arch .r.up{padding-bottom:4px;border-bottom:2px solid var(--ink)}
.arch .mid{width:2px;align-self:stretch;background:var(--ink);margin:0 4px}

.tooth:hover{border-color:var(--muted)}
.tooth[aria-pressed=&quot;true&quot;]{background:var(--enamel);color:var(--enamel-ink);border-color:var(--enamel-edge);font-weight:700}
.arch-tools{display:flex;gap:14px;margin-top:5px;font-size:.84rem}
.link{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.link:hover{color:var(--ink)}

.add{margin-top:16px;border:1px dashed var(--muted);background:none;border-radius:8px;padding:10px 16px;color:var(--ink)}
.add:hover{background:var(--surface)}

/* note */
aside{background:var(--surface);border-left:1px solid var(--line);padding:22px 20px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:10px}
.note-h{display:flex;align-items:center;gap:8px}
.note-h h2{margin:0;font-size:1.05rem;margin-right:auto}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
#note{flex:1;overflow:auto;margin:0;white-space:pre-wrap;font-family:var(--mono);font-size:.83rem;line-height:1.6;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:14px 16px}
.hint{margin:0;font-size:.8rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);opacity:0;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:.9rem;transition:opacity .16s,transform .16s;pointer-events:none;z-index:40}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.mbar{display:none}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  aside{position:static;height:auto;border-left:0;border-top:1px solid var(--line);padding-bottom:110px}

  .lab{padding-top:0}

  .mbar .btn{flex:1}
  .tooth{width:28px;height:30px;font-size:.74rem}
}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}

function laLine(kb, prefix){

  let vol = one(kb + &quot;.vol&quot;); const cart = one(kb + &quot;.cart&quot;);
  let volStr = &quot;&quot;;

    if (!/x$/i.test(vol) &amp;&amp; /^[\d\/.]+$/.test(vol)) vol += &quot; x&quot;;
    const plural = !/^(1\/2|1) x$/.test(vol);
    volStr = vol + (cart ? &quot; &quot; + cart : &quot;&quot;) + &quot; cartridge&quot; + (plural ? &quot;s&quot; : &quot;&quot;);
  }
  const parts = [agent, volStr].filter(Boolean);
  return prefix + (parts.length ? &quot;: &quot; + parts.join(&quot;, &quot;) : &quot;&quot;);
}
function buildNote(){
  const out = [];
  // appointment
  const a = [&quot;** Filling Appointment **&quot;];
  if (S.clin &amp;&amp; S.clin.trim()) a.push(&quot;Clinician: &quot; + S.clin.trim());
  if (one(&quot;da&quot;)) a.push(&quot;DA: &quot; + one(&quot;da&quot;));
  if (one(&quot;co&quot;)) a.push(&quot;C/O: &quot; + one(&quot;co&quot;));
  if (one(&quot;mh&quot;)) a.push(&quot;MH checked: &quot; + one(&quot;mh&quot;));
  if (S.riskLine){
    const r = many(&quot;risks&quot;, RISKS);
    a.push(sent(ft(&quot;riskLine&quot;, RISK_TEXT)) + (r.length ? &quot; Also discussed case specific risk(s) of: &quot; + andList(r.map(x =&gt; /^[A-Z][a-z]/.test(x) ? x.charAt(0).toLowerCase() + x.slice(1) : x)) + &quot;.&quot; : &quot;&quot;));
  }
  if (S.consent) a.push(sent(ft(&quot;consent&quot;, CONSENT_TEXT)));
  if (a.length &gt; 1) out.push(a.join(&quot;\n&quot;));
  // LA
  const t = S.la;
  if (t){
    const l = [&quot;** LA **&quot;];
    if (t === &quot;Nil&quot;) l.push(&quot;Nil&quot;);
    if (t === &quot;Infiltration&quot; || t === &quot;IANB + infiltration&quot;){
      const sites = many(&quot;inf.site&quot;, SITES).map(s =&gt; s.toLowerCase());
      l.push(laLine(&quot;inf&quot;, &quot;Infiltration&quot; + (sites.length ? &quot; (&quot; + sites.join(&quot;, &quot;) + &quot;)&quot; : &quot;&quot;)));
    }
    if (t === &quot;IANB&quot; || t === &quot;IANB + infiltration&quot;) l.push(laLine(&quot;ianb&quot;, &quot;IANB&quot; + (one(&quot;ianb.side&quot;) ? &quot; (&quot; + one(&quot;ianb.side&quot;) + &quot;)&quot; : &quot;&quot;)));
    if (t === &quot;Other&quot;) l.push(laLine(&quot;oth&quot;, (S[&quot;oth.type&quot;] || &quot;&quot;).trim() || &quot;Other&quot;));
    if (t === &quot;Other&quot; &amp;&amp; !S[&quot;la~o&quot;]) {} // handled above
    out.push(l.join(&quot;\n&quot;));
  }
  // restorations
  R.forEach(id =&gt; {
    const k = f =&gt; id + &quot;.&quot; + f;
    const teeth = S[k(&quot;teeth&quot;)] || [];
    const lines = [];
    if (S[k(&quot;occPre&quot;)] &amp;&amp; (teeth.length || hasAnyRestData(id))) lines.push(ft(k(&quot;occPre&quot;), OCC_PRE));
    const moist = many(k(&quot;moist&quot;), MOIST);
    if (moist.length){
      let s = &quot;Moisture control achieved using &quot; + andList(moist) + &quot;.&quot;;
      if (has(k(&quot;moist&quot;), &quot;rubber dam&quot;) &amp;&amp; one(k(&quot;rd&quot;))) s += &quot; &quot; + one(k(&quot;rd&quot;)) + &quot; tooth isolation. Template used and contacts flossed prior.&quot;;
      lines.push(s);
    }
    many(k(&quot;prev&quot;), PREV).forEach(p =&gt; lines.push(sent(p)));
    const car = one(k(&quot;car&quot;));
    if (car){
      let s = sent(car);
      if (S[k(&quot;car&quot;)] === CARIES[0]){
        const c2 = one(k(&quot;car2&quot;));
        if (c2) s += &quot; &quot; + sent(c2);
        if (S[k(&quot;car2&quot;)] === CARIES2[0] &amp;&amp; one(k(&quot;scr&quot;))) s += &quot; Selective caries removal: &quot; + one(k(&quot;scr&quot;)) + &quot;.&quot;;
      }
      lines.push(s);
    }
    const lin = one(k(&quot;lin&quot;));
    if (lin){
      let s = &quot;Cavity liner/base &quot; + lin + &quot;.&quot;;
      if (S[k(&quot;lin&quot;)] === &quot;placed&quot; &amp;&amp; one(k(&quot;linmat&quot;))) s += &quot; Material used: &quot; + one(k(&quot;linmat&quot;)) + &quot;.&quot;;
      lines.push(s);
    }
    const mat = S[k(&quot;mat&quot;)];
    if (mat){
      let ms;
      if (mat === &quot;Greater Curve band&quot;){
        const g = S[k(&quot;gc&quot;)];
        const type = g === &quot;Standard&quot; || g === &quot;Wide&quot; ? lab(k(&quot;gc&quot;), g).toLowerCase() : one(k(&quot;gc&quot;));
        ms = &quot;Greater Curve &quot; + [type, S[k(&quot;thin&quot;)] ? &quot;ultra thin&quot; : &quot;&quot;, S[k(&quot;ss&quot;)] ? &quot;stainless steel&quot; : &quot;brass&quot;].filter(Boolean).join(&quot; &quot;) + &quot; band&quot;;
        if (S[k(&quot;cod&quot;)]) ms += &quot;, contact opening&quot;;
      } else ms = one(k(&quot;mat&quot;));
      if (ms &amp;&amp; S[k(&quot;wedge&quot;)] &amp;&amp; mat !== &quot;No matrix band required&quot;) ms += &quot;, wedge placed&quot;;
      if (ms) lines.push(&quot;Matrix system: &quot; + ms + &quot;.&quot;);
    }
    const m = S[k(&quot;matl&quot;)];
    if (m === &quot;Composite&quot;){
      lines.push(&quot;Etched, bonded and restored with &quot; + (one(k(&quot;brand&quot;)) ? one(k(&quot;brand&quot;)) + &quot; &quot; : &quot;&quot;) + &quot;composite&quot; + (one(k(&quot;shade&quot;)) ? &quot; shade &quot; + one(k(&quot;shade&quot;)) : &quot;&quot;) + &quot;.&quot;);
      if (S[k(&quot;proto&quot;)]) lines.push(sent(ft(k(&quot;proto&quot;), PROTOCOL)));
    }
    else if (m === &quot;GIC&quot;) lines.push(&quot;GIC placed, vaseline applied.&quot;);
    else if (m === &quot;Amalgam&quot;) lines.push(S[k(&quot;amal&quot;)] ? sent(ft(k(&quot;amal&quot;), AMALGAM_TEXT)) : &quot;Amalgam placed.&quot;);
    else if (m === &quot;RMGIC&quot;) lines.push(&quot;RMGIC placed and cured.&quot;);
    else if (m === &quot;Other&quot; &amp;&amp; one(k(&quot;matl&quot;))) lines.push(sent(one(k(&quot;matl&quot;)) + &quot; restoration placed&quot;));
    const occ = S[k(&quot;occ&quot;)];
    if (occ === &quot;Other&quot; &amp;&amp; one(k(&quot;occ&quot;))) lines.push(&quot;Occlusion checked: &quot; + sent(one(k(&quot;occ&quot;))));
    else if (occ &amp;&amp; occ !== &quot;Other&quot;) lines.push(&quot;Occlusion checked&quot; + (occ.startsWith(&quot;and&quot;) ? &quot; &quot; : &quot;, &quot;) + occ + &quot;.&quot;);

  });

  const p = [&quot;** Post-op Discussion **&quot;];
  const pulp = anyRest(&quot;scr&quot;, v =&gt; v === SCR[0] || v === SCR[1]);
  const gic = anyRest(&quot;matl&quot;, v =&gt; v === &quot;GIC&quot;);
  const comp = anyRest(&quot;matl&quot;, v =&gt; v === &quot;Composite&quot;);
  if (S.postBase) p.push(sent(ft(&quot;postBase&quot;, POST_BASE)));
  if (pulp &amp;&amp; S.postPulp) p.push(sent(ft(&quot;postPulp&quot;, POST_PULP)));
  if (gic &amp;&amp; S.postGic) p.push(sent(ft(&quot;postGic&quot;, POST_GIC)));
  if (comp &amp;&amp; S.postComp) p.push(sent(ft(&quot;postComp&quot;, POST_COMP)));
  if ((S.postExtra || &quot;&quot;).trim()) p.push(sent(S.postExtra));
  if (p.length &gt; 1) out.push(p.join(&quot;\n&quot;));
  if ((S.extra || &quot;&quot;).trim()) out.push(&quot;** Additional Notes **\n&quot; + S.extra.trim());

  return out.join(&quot;\n\n&quot;);
}
function hasAnyRestData(id){

}

/* ---------- render ---------- */
function renderNote(){

}

  f.replaceChildren(apptSection(), laSection(), ...R.map(restSection), add, postSection(), endSection());
  renderNote();

function laLine(kb, prefix){

  let volStr = &quot;&quot;;
  if (vol){
    if (!/x$/i.test(vol) &amp;&amp; /^[\d\/.]+$/.test(vol)) vol += &quot; x&quot;;
    const plural = !/^(1\/2|1) x$/.test(vol);
    volStr = vol + (cart ? &quot; &quot; + cart : &quot;&quot;) + &quot; cartridge&quot; + (plural ? &quot;s&quot; : &quot;&quot;);
  }
  const parts = [agent, volStr].filter(Boolean);
  return prefix + (parts.length ? &quot;: &quot; + parts.join(&quot;, &quot;) : &quot;&quot;);
}
const lc = x =&gt; x &amp;&amp; /^[A-Z][a-z]/.test(x) ? x.charAt(0).toLowerCase() + x.slice(1) : x;
function buildNote(){

  const reasons = many(&quot;reason&quot;, REASONS);
  if (reasons.length) a.push(&quot;Reason for XLA: &quot; + andList(reasons.map(lc)) + &quot;.&quot;);
  const alts = many(&quot;alts&quot;, ALTS);
  if (alts.length) a.push(&quot;Alternative options discussed: &quot; + andList(alts.map(lc)) + &quot;.&quot;);
  if (one(&quot;gap&quot;)) a.push(&quot;Plan for the gap: &quot; + one(&quot;gap&quot;) + &quot;.&quot;);
  if (S.riskLine) a.push(sent(ft(&quot;riskLine&quot;, RISK_TEXT)));
  const spec = many(&quot;spec&quot;, SPEC_RISKS);
  if (spec.length) a.push(&quot;Specific risks discussed: &quot; + andList(spec.map(lc)) + &quot;.&quot;);
  if (has(&quot;spec&quot;, &quot;Risk of MRONJ&quot;) &amp;&amp; S.mronjTxt) a.push(sent(&quot;Patient is &quot; + (one(&quot;mronj&quot;) ? one(&quot;mronj&quot;) + &quot; &quot; : &quot;&quot;) + ft(&quot;mronjTxt&quot;, MRONJ_TEXT)));
  if (S.consent) a.push(sent(ft(&quot;consent&quot;, CONSENT_TEXT)));

    }

  return section(&quot;post&quot;, &quot;Post-op discussion&quot;, [ fixed(&quot;advice&quot;, ADVICE_TEXT), row(&quot;TCA&quot;, chips(dressed() ? &quot;tcaD&quot; : &quot;tca&quot;, dressed() ? TCA_DRESSED : TCA_DONE)) ]);
}

/* ---------- note ---------- */
function buildNote(){
  const out = [];
  const a = [&quot;** Pre-op Discussion **&quot;];
  if (S.clin &amp;&amp; S.clin.trim()) a.push(&quot;Clinician: &quot; + S.clin.trim());
  if (one(&quot;da&quot;)) a.push(&quot;DA: &quot; + one(&quot;da&quot;));
  if (one(&quot;mh&quot;)) a.push(&quot;MH checked: &quot; + one(&quot;mh&quot;));
  const tooth = (S.tooth || [])[0];
  if (tooth) a.push((first() ? &quot;Attending for RCT of &quot; : &quot;Attending to continue RCT of &quot;) + tooth + &quot;.&quot;);
  if (one(&quot;sym&quot;)) a.push((first() ? &quot;Pre-operative symptoms: &quot; : &quot;Symptoms since last visit: &quot;) + one(&quot;sym&quot;) + &quot;.&quot;);
  if (first()){
    if (one(&quot;refer&quot;)) a.push(&quot;Discussed option of referral to specialist: &quot; + one(&quot;refer&quot;) + &quot;.&quot;);
    a.push(fixedLine(&quot;risk&quot;, RISK_TEXT), fixedLine(&quot;prog&quot;, PROG_TEXT));
  } else a.push(fixedLine(&quot;redisc&quot;, REDISC_TEXT), fixedLine(&quot;happy&quot;, HAPPY_TEXT));
  a.push(fixedLine(&quot;consent&quot;, CONSENT_TEXT));
  out.push(a.filter(Boolean).join(&quot;\n&quot;));
  const la = laNote(); if (la) out.push(la);

  const ac = [&quot;** Access **&quot;];
  if (one(&quot;iso&quot;)) ac.push(one(&quot;iso&quot;) + &quot; tooth isolation with rubber dam.&quot;);
  ac.push(first() ? fixedLine(&quot;access&quot;, ACCESS_1) : fixedLine(&quot;access2&quot;, ACCESS_2));
  const cl = canalList();
  if (one(&quot;ncan&quot;) || cl.length) ac.push(&quot;Number of canals found: &quot; + (one(&quot;ncan&quot;) || cl.length) + (cl.length ? &quot;, including &quot; + andList(cl) : &quot;&quot;) + &quot;.&quot;);
  if (S.glide) ac.push(GLIDE_TEXT);
  out.push(ac.filter(Boolean).join(&quot;\n&quot;));

  const keys = canalKeys();
  const ln = [&quot;** Canal Length **&quot;, first() ? fixedLine(&quot;wl&quot;, WL_1) : fixedLine(&quot;wl2&quot;, WL_2)];
  const withLen = keys.filter(c =&gt; (S[&quot;zr.&quot; + c] || &quot;&quot;).toString().trim());
  if (withLen.length){
    ln.push(&quot;Zero readings from the &quot; + (one(&quot;ref&quot;) || &quot;occlusal surface&quot;) + &quot;:&quot;);
    withLen.forEach(c =&gt; ln.push(canalName(c) + &quot;: &quot; + S[&quot;zr.&quot; + c] + &quot;mm&quot;));
  }
  out.push(ln.filter(Boolean).join(&quot;\n&quot;));

  const sh = [&quot;** Shaping and Irrigation **&quot;];
  const sys = one(&quot;system&quot;);
  if (sys) sh.push(&quot;Biomechanical preparation using &quot; + sys + &quot;.&quot;);
  const fs = keys.filter(c =&gt; one(&quot;fs.&quot; + c));
  if (fs.length){ sh.push(&quot;Final shaping with:&quot;); fs.forEach(c =&gt; sh.push(canalName(c) + &quot;: &quot; + one(&quot;fs.&quot; + c))); }
  sh.push(fixedLine(&quot;patency&quot;, PATENCY_TEXT));
  if (one(&quot;irrig&quot;)) sh.push(&quot;Copious and careful irrigation throughout with &quot; + one(&quot;irrig&quot;) + &quot;, marked at 2mm short of WL&quot; + (S.us ? &quot;, with ultrasonic activation&quot; : &quot;&quot;) + &quot;.&quot;);
  else if (S.us) sh.push(&quot;Ultrasonic activation of irrigant.&quot;);
  sh.push(fixedLine(&quot;dried&quot;, DRIED_TEXT));
  out.push(sh.filter(Boolean).join(&quot;\n&quot;));

  if (S.rad){
    const r = [&quot;** Radiograph **&quot;, sent(one(&quot;rad&quot;))];
    if (/radiograph taken/.test(S.rad)){
      if (one(&quot;grade&quot;)) r.push(&quot;Grade: &quot; + one(&quot;grade&quot;));
      if (one(&quot;radRep&quot;)) r.push(&quot;Report: &quot; + sent(one(&quot;radRep&quot;)));
    }
    out.push(r.join(&quot;\n&quot;));
  }

  if (dressed()){
    const d = [&quot;** Interim Dressing **&quot;, fixedLine(&quot;dressTxt&quot;, DRESS_TEXT)];
    const p1 = one(&quot;dr1&quot;), p2 = one(&quot;dr2&quot;);
    if (p1 || p2) d.push(&quot;Temporised with &quot; + [p1 &amp;&amp; (p1 === &quot;PTFE tape&quot; ? p1 : lc(p1)), p2].filter(Boolean).join(&quot; and &quot;) + &quot;.&quot;);
    out.push(d.filter(Boolean).join(&quot;\n&quot;));
  } else {
    const o = [&quot;** Obturation **&quot;];
    const tech = one(&quot;obt&quot;), seal = one(&quot;sealer&quot;);
    o.push(&quot;Obturated using &quot; + (tech ? lc(tech) + &quot; technique with &quot; : &quot;&quot;) + &quot;matched customised GP points&quot; + (seal ? &quot; and &quot; + seal + &quot; sealer&quot; : &quot; and sealer&quot;) + &quot;.&quot;);
    out.push(o.join(&quot;\n&quot;));
    if (S.postRad){
      const pr = [&quot;** Post-op Radiograph **&quot;, fixedLine(&quot;postRad&quot;, POST_RAD_TEXT)];
      if (one(&quot;postGrade&quot;)) pr.push(&quot;Grade: &quot; + one(&quot;postGrade&quot;));
      if (one(&quot;postRep&quot;)) pr.push(&quot;Report: &quot; + sent(one(&quot;postRep&quot;)));
      out.push(pr.join(&quot;\n&quot;));
    }
    const rs = [&quot;** Restoration **&quot;];
    if (one(&quot;orifice&quot;)) rs.push(&quot;Canal openings sealed with &quot; + lc(one(&quot;orifice&quot;)) + &quot;.&quot;);
    const rw = S.restored;
    if (rw === &quot;Composite&quot;) rs.push(&quot;Restored with &quot; + (one(&quot;brand&quot;) ? one(&quot;brand&quot;) + &quot; &quot; : &quot;&quot;) + &quot;composite&quot; + (one(&quot;shade&quot;) ? &quot; shade &quot; + one(&quot;shade&quot;) : &quot;&quot;) + &quot;.&quot;);
    else if (one(&quot;restored&quot;)) rs.push(&quot;Restored with &quot; + one(&quot;restored&quot;) + &quot;.&quot;);
    const df = S.defin;
    if (df === &quot;Completed&quot;) rs.push(&quot;Definitive restoration completed today.&quot;);
    else if (one(&quot;defin&quot;)) rs.push(&quot;Planned definitive restoration: &quot; + lc(one(&quot;defin&quot;)) + &quot;.&quot;);
    if (rs.length &gt; 1) out.push(rs.join(&quot;\n&quot;));
  }

  const p = [&quot;** Post-op Discussion **&quot;, fixedLine(&quot;advice&quot;, ADVICE_TEXT)];
  const tca = one(dressed() ? &quot;tcaD&quot; : &quot;tca&quot;);
  if (tca) p.push(&quot;TCA: &quot; + tca);
  out.push(p.filter(Boolean).join(&quot;\n&quot;));
  endNotes(out);
  return out.join(&quot;\n\n&quot;);
}
function render(){
  const f = $(&quot;form&quot;);
  f.replaceChildren(preSection(), laSection(), accessSection(), lengthSection(), shapingSection(), radSection(), finishSection(), postSection(), endSection());
  renderNote();
  if (pendingFocus){ const el2 = f.querySelector(&#x27;[data-key=&quot;&#x27; + pendingFocus + &#x27;&quot;]&#x27;); if (el2) el2.focus(); pendingFocus = null; }
}
/* ---------- actions ---------- */
let tt;
function toast(msg){ const t = $(&quot;toast&quot;); t.textContent = msg; t.classList.add(&quot;show&quot;); clearTimeout(tt); tt = setTimeout(() =&gt; t.classList.remove(&quot;show&quot;), 1600); }
async function copyNote(){
  const txt = buildNote();
  if (!txt){ toast(&quot;Nothing to copy yet&quot;); return; }
  let ok = false;
  try { await navigator.clipboard.writeText(txt); ok = true; }
  catch(e){
    const ta = el(&quot;textarea&quot;); ta.value = txt; ta.style.position = &quot;fixed&quot;; ta.style.opacity = &quot;0&quot;; document.body.append(ta); ta.select();
    try { ok = document.execCommand(&quot;copy&quot;); } catch(_){}
    ta.remove();
  }
  toast(ok ? &quot;Note copied&quot; : &quot;Couldn’t copy. Select the note and copy it manually.&quot;);
}
function newNote(){ fresh(); for (const k in collapsed) delete collapsed[k]; render(); window.scrollTo(0, 0); toast(&quot;New note started&quot;); }

$(&quot;copyBtn&quot;).onclick = $(&quot;mCopy&quot;).onclick = copyNote;
$(&quot;newBtn&quot;).onclick = $(&quot;mNew&quot;).onclick = newNote;
$(&quot;mView&quot;).onclick = () =&gt; $(&quot;note&quot;).scrollIntoView({ behavior: &quot;smooth&quot;, block: &quot;start&quot; });
document.addEventListener(&quot;keydown&quot;, e =&gt; { if ((e.ctrlKey || e.metaKey) &amp;&amp; e.key === &quot;Enter&quot;){ e.preventDefault(); copyNote(); } });

fresh(); render();
window.DN_apply = function(){
  const oldC = CLINICIAN, oldD = defaultDA();
  loadSettings();
  if (!S.clin || S.clin === oldC) S.clin = CLINICIAN;
  if (!S.da || S.da === oldD || !DA_LIST.includes(S.da)) S.da = defaultDA();
  render();
};

})();
&lt;/script&gt;
&lt;/body&gt;

"></iframe>
<section id="p-info" aria-label="Your details">
  <div class="card">
    <h1>Your details</h1>
    <p>The dentist and dental assistant names are used across every template. They’re saved in this browser on this computer only, so each person sharing the file can set their own.</p>
    <label for="clin">Dentist name <small>Shown as the Clinician line in every note.</small></label>
    <input id="clin" type="text" autocomplete="off" placeholder="e.g. Dr Alex Smith">
    <label for="das">Dental assistant names <small>One per line. The first name is selected by default, and you can still pick Other in any note.</small></label>
    <textarea id="das" placeholder="e.g. Sam"></textarea>
    <button type="button" class="save" id="save">Save details</button><button type="button" class="reset" id="reset">Clear details</button><span class="status" id="status" role="status"></span>
  </div>
</section>
</main>
<script>
(function(){
  const KEY = "dentalnotes.settings", DEF = { clinician: "", das: [] };
  let firstRun = false;
  function load(){ try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s) return s; } catch(e){} firstRun = true; return { clinician: DEF.clinician, das: DEF.das.slice() }; }
  window.DN_SETTINGS = load();
  const clin = document.getElementById("clin"), das = document.getElementById("das"), status = document.getElementById("status");
  function fill(){ clin.value = window.DN_SETTINGS.clinician || ""; das.value = (window.DN_SETTINGS.das || []).join("\n"); }
  function pushToFrames(){ document.querySelectorAll("iframe").forEach(f => { try { f.contentWindow.DN_apply && f.contentWindow.DN_apply(); } catch(e){} }); }
  function save(s, msg){
    window.DN_SETTINGS = s;
    let stored = true; try { localStorage.setItem(KEY, JSON.stringify(s)); } catch(e){ stored = false; }
    pushToFrames(); fill();
    status.textContent = stored ? msg : "Updated for now, but this browser won’t let the page remember it.";
    setTimeout(() => status.textContent = "", 3000);
  }
  document.getElementById("save").onclick = () => save({ clinician: clin.value.trim(), das: das.value.split("\n").map(x => x.trim()).filter(Boolean) }, "Saved");
  document.getElementById("reset").onclick = () => save({ clinician: DEF.clinician, das: DEF.das.slice() }, "Cleared");
  fill();

  const keys = ['filling', 'extraction', 'prep', 'fit', 'endo', 'info'];
  function show(k){
    if (!keys.includes(k)) k = keys[0];
    document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.key === k)));
    document.querySelectorAll("iframe").forEach(f => f.classList.toggle("on", f.id === "f-" + k));
    document.getElementById("p-info").classList.toggle("on", k === "info");
    document.title = document.querySelector('.tab[data-key="' + k + '"]').textContent + " · Dental notes";
    try { if (location.hash !== "#" + k) history.replaceState(null, "", "#" + k); } catch(e){ /* previews that block history changes: tabs still work */ }
  }
  document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => show(t.dataset.key)));
  window.addEventListener("hashchange", () => show(location.hash.slice(1)));
  document.addEventListener("keydown", e => { if (e.altKey && /^[1-5]$/.test(e.key)){ e.preventDefault(); show(keys[+e.key - 1]); } });
  show(firstRun && !window.DN_SETTINGS.clinician ? "info" : location.hash.slice(1));
})();
</script>
